name: Validate Subdealer Importer
on:
  push:
    branches: [feature/subdealer-memo-importer]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Existing repository-wide React hook lint failures are tracked separately.
      - run: npx eslint lib/ptg/subdealer-pdf.ts app/price-memos/subdealer
      - run: node --test lib/ptg/subdealer-layout.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
