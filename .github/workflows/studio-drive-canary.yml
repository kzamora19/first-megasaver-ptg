name: One-time synthetic Google Drive encrypted roundtrip
on:
  push:
    branches: [feature/studio-gateway-pages-refresh-20261121]
    paths:
      - "tests/studio-central-drive-canary.mjs"
      - ".github/workflows/studio-drive-canary.yml"
permissions:
  contents: read
  id-token: write
jobs:
  verify-synthetic-drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Test small synthetic encrypted save, listing, decrypt, wrong-account deny and canary removal
        run: node tests/studio-central-drive-canary.mjs
