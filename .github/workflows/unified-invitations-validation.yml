name: Validate Unified Invitations
on:
  push:
    branches: [feature/unified-invitations]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify role and branch mapping
        run: node --test lib/ptg/unified-invitation-rules.test.mjs
      - name: Lint new invitation code
        run: npx eslint lib/ptg/unified-invitation-rules.mjs app/data-desk/unified-invitations.tsx
      - run: npx tsc --noEmit
      - run: npm run build
