name: Unified SSO Phase 2 Validation
on:
  push:
    branches: [feature/unified-sso-phase2-20261115]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Lint SSO client and callback
        run: npx eslint app/sso/callback/page.tsx lib/ptg/unified-sso-client.ts app/login/page.tsx
      - name: Type-check complete PTG app
        run: npx tsc --noEmit
      - name: Build static workspace with SSO UI gated off
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Auth SSO types
        run: deno check supabase/functions/ptg-auth/index.ts
