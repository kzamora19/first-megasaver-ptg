name: CI

on:
  push:
    branches: ["migration/scaffold"]
  pull_request:
    branches: ["migration/scaffold"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
