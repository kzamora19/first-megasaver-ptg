name: Deploy GitHub Pages

on:
  push:
    branches:
      - migration/github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /first-megasaver-ptg
      NEXT_PUBLIC_SUPABASE_URL: https://agknxlowackphvwyvxge.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kv2q3dnNQt4ij0mgkOLbQQ_S2MO9FvG
      NEXT_PUBLIC_PTG_USE_EDGE_AUTH: "true"
      NEXT_PUBLIC_PTG_USE_EDGE_DATA: "true"
      NEXT_PUBLIC_PTG_USE_EDGE_ASSETS: "true"
      NEXT_PUBLIC_PTG_USE_EDGE_ACCOUNTS: "true"
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_URL: https://psoopubvdpwztzkdyifa.supabase.co
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e_6K64Wul2fJEq2KiuvnTA_NmuaKqNm
      NEXT_PUBLIC_PTG_ENABLE_CATALOG_PILOT_WRITES: "false"

      NEXT_PUBLIC_PTG_ENABLE_BATCH_IMPORT_WRITES: "true"
      # Creative Studios are disabled in routine builds. Only the owner-authorized
      # coordinated Pages dispatch embeds protected launch destinations.
      NEXT_PUBLIC_STUDIO_MEGAFRAME_LAUNCH_URL: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/migration/github-pages' && vars.PTG_STUDIOS_CUTOVER_APPROVED == 'true' && 'https://kzamora19.github.io/megaframe-studio/studio/' || '' }}
      NEXT_PUBLIC_STUDIO_FLYER_LAUNCH_URL: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/migration/github-pages' && vars.PTG_STUDIOS_CUTOVER_APPROVED == 'true' && 'https://kzamora19.github.io/flyer-studio/studio/' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify Subdealer PDF field extraction
        run: node --test lib/ptg/subdealer-layout.test.mjs
      - name: Verify PTG responsive screen and print separation
        run: node --test lib/ptg/responsive-layout.test.mjs
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # Do not auto-publish PTG Studio navigation simply because the staged PR is
    # merged. Release requires a manual dispatch on the production Pages branch
    # AND an explicit owner-controlled repository variable.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/migration/github-pages' && vars.PTG_STUDIOS_CUTOVER_APPROVED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
