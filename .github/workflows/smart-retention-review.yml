name: Smart retention review only
on:
  push:
    branches: [feature/smart-retention-review-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/smart-retention-review-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_review_only_not_a_real_key
      NEXT_PUBLIC_PTG_USE_EDGE_AUTH: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_DATA: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ASSETS: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ACCOUNTS: 'true'
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_review_only_not_a_real_key
      NEXT_PUBLIC_PTG_ENABLE_BATCH_IMPORT_WRITES: 'false'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-fixture-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test database candidates in disposable PostgreSQL
        run: |
          for file in fixture.sql catalog.sql registry.sql storage-review.sql catalog-tests.sql registry-tests.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -d postgres < "review/smart-retention/$file"
          done
      - name: Test cleanup Storage API adapter and existing import plans
        run: node --test review/smart-retention/cleanup-tests.mjs review/smart-retention/envelope-tests.mjs lib/ptg/batch-import.test.mjs tests/widget-memo-projection.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check updated server endpoints
        run: deno check --node-modules-dir=auto supabase/functions/ptg-products/index.ts supabase/functions/ptg-accounts/index.ts supabase/functions/ptg-widget-announcements/index.ts supabase/functions/ptg-retention-worker/index.ts

  real-storage-api:
    if: github.ref == 'refs/heads/feature/smart-retention-review-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install pinned test client and PostgreSQL client
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @supabase/supabase-js@2.95.0
          if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Start disposable local Supabase (never link or deploy)
        run: |
          mkdir -p "$RUNNER_TEMP/retention-local"
          cd "$RUNNER_TEMP/retention-local"
          supabase --help
          supabase start --help
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/retention-local.env"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test actual Storage API with synthetic files only
        run: node review/smart-retention/real-storage-tests.mjs "$RUNNER_TEMP/retention-local.env"
      - name: Test authenticated System Admin HTTP handlers on local stack
        run: node review/smart-retention/authenticated-http-tests.mjs "$RUNNER_TEMP/retention-local.env"
      - name: Remove disposable local test stack
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/retention-local/supabase" ]; then
            cd "$RUNNER_TEMP/retention-local"
            supabase stop --no-backup
          fi
