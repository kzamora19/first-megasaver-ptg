name: Inspect existing Windows shell (source recovery)
on:
  push:
    branches:
      - fix/windows-installed-navigation-20261123
    paths:
      - .github/workflows/inspect-legacy-windows-shell.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-existing-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Decompile original published launcher
        shell: pwsh
        run: |
          dotnet tool install --global ilspycmd
          $dest = Join-Path $env:RUNNER_TEMP 'branchline-original'
          $source = Join-Path $env:RUNNER_TEMP 'branchline-recovered'
          Expand-Archive -LiteralPath 'public/branchline-workspace-windows.zip' -DestinationPath $dest -Force
          ilspycmd --project -o $source (Join-Path $dest 'Branchline Workspace.exe')
          "Recovered source files:"
          Get-ChildItem -LiteralPath $source -Recurse -File | ForEach-Object { $_.FullName.Substring($source.Length) }
          "Navigation-related matches:"
          Get-ChildItem -LiteralPath $source -Recurse -Filter '*.cs' | Select-String -Pattern 'Data Desk','Frame','Flyer','Menu','CoreWebView2Environment','userDataFolder','data-branchline-menu','ptg-menu-toggle' | Select-Object -First 140 | ForEach-Object { "$($_.Path.Substring($source.Length)):$($_.LineNumber):$($_.Line.Trim())" }
          $main = Get-ChildItem -LiteralPath $source -Recurse -Filter '*.cs' | Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'class MainForm|class WorkspaceForm|class MainWindow|WebView2 webView' } | Select-Object -First 1
          if ($main) {
            "MAIN SOURCE: $($main.FullName)"
            Get-Content -LiteralPath $main.FullName | Select-Object -First 550
          }
          "RECOVERED_SOURCE=$source" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-branchline-windows-source-inspection
          path: ${{ runner.temp }}/branchline-recovered/
          retention-days: 3
