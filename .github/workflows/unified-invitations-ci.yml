name: Validate Unified Invitations
on:
  push:
    branches:
      - feature/unified-invitations-nov15
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint unified invitation admin view
        run: npx eslint app/data-desk/unified-invitations.tsx
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Verify static production build
        run: npm run build
