name: Controlled live Studio Pages smoke check
on:
  push:
    branches: [feature/studio-gateway-pages-refresh-20261121]
    paths:
      - "tests/studio-live-pages-smoke.mjs"
      - ".github/workflows/studio-live-pages-smoke.yml"
permissions:
  contents: read
jobs:
  live-pages-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tests/studio-live-pages-smoke.mjs
