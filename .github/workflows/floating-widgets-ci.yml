name: Floating widget module checks
on:
  pull_request:
  push:
    branches: [feature/floating-widgets]
permissions:
  contents: read
jobs:
  widgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing updater and shared source syntax
        run: |
          node --test tests/r6-web-updates.test.cjs
          for file in public/widgets/*.js public/updates/check.js; do node --check "$file"; done
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Test module widget startup and original update bell
        run: node tests/floating-module-browser.mjs ptg public /first-megasaver-ptg /products/
